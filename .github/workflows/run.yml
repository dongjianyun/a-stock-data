name: Auto Stock Post

on:
  schedule:
    # 🕒 核心闹钟配置：每天下午 16:30 自动运行 (周一至周五)
    # GitHub 采用世界标准时间 (UTC)，北京时间 16:30 对应 UTC 的 08:30
    - cron: '30 8 * * 1-5'
  
  # 🔘 备用开关：允许你在 GitHub 网页上手动点击按钮“立刻测试运行”
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 签出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络请求依赖
        run: pip install requests

      - name: 4. 执行盯盘脚本并推送微信
        env:
          # 🔐 从你步骤2配置的“保险箱”里取出微信钥匙
          MP_APPID: ${{ secrets.MP_APPID }}
          MP_APPSECRET: ${{ secrets.MP_APPSECRET }}
        run: python main.py
