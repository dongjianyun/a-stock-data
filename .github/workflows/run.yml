name: Auto Stock Post

on:
  schedule:
    - cron: '30 8 * * 1-5' # 周一至周五下午 16:30 自动运行
  workflow_dispatch: # 支持手动触发测试

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 签出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装画图与网络核心依赖
        # 💡 核心修复：强制让机器人在启动时，必须先安装完 requests、matplotlib 和 numpy 三个库
        run: pip install requests matplotlib numpy

      - name: 4. 执行绘图脚本并保存结果
        run: python main.py

      - name: 5. 自动把生成的图片保存并提交到你的仓库主页
        run: |
          git config --global user.name "StockBot"
          git config --global user.email "stockbot@github.com"
          git add infographic.png
          git commit -m "自动更新今日主力资金全景长图" || exit 0
          git push
